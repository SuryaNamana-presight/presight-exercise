services:
  directory:
    build: .
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      DATABASE_PATH: /app/data/directory.db
      SEED_COUNT: 2400
    volumes:
      - directory-data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD", "wget", "-q", "--spider", "http://localhost:4000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  directory-data:
